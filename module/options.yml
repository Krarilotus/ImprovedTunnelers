    display: Switch
    contents:
      type: boolean
      value: true
  - url: improved-tunnelers.retarget.range
    name: improved-tunnelers-retarget-range
    text: '{{retarget_range}}'
    tooltip: '{{retarget_range_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 80
      min: 20
      max: 200
      step: 10
  - url: improved-tunnelers.retarget.max
    name: improved-tunnelers-retarget-max
    text: '{{retarget_max}}'
    tooltip: '{{retarget_max_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 5
      min: 1
      max: 20
      step: 1
  - url: improved-tunnelers.retarget.collapse_behind
    name: improved-tunnelers-retarget-collapse-behind
    text: '{{retarget_collapse}}'
    tooltip: '{{retarget_collapse_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true

