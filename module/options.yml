meta:
  version: 1.0.0
options:
- display: GroupBox
  category: ['{{balance_changes}}']
  header: '{{denial_group}}'
  hasHeader: true
  children:
  - url: improved-tunnelers.denial
    name: improved-tunnelers-denial-duration
    header: '{{denial_enabled}}'
    text: '{{denial_enabled_tooltip}}'
    hasHeader: true
    display: UCP2Slider
    contents:
      value:
        enabled: true
        sliderValue: 100
      min: 1
      max: 2400
      step: 1
      decimals: 0
  - url: improved-tunnelers.denial.message
    name: improved-tunnelers-denial-message
    text: '{{denial_message}}'
    tooltip: '{{denial_message_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true

- display: GroupBox
  category: ['{{bugfixes}}']
  header: '{{terrain_group}}'
  hasHeader: true
  children:
  - url: improved-tunnelers.terrain.enabled
    name: improved-tunnelers-terrain-enabled
    text: '{{terrain_enabled}}'
    tooltip: '{{terrain_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true

- display: GroupBox
  category: ['{{balance_changes}}']
  header: '{{retarget_group}}'
  hasHeader: true
  children:
  - url: improved-tunnelers.retarget.enabled
    name: improved-tunnelers-retarget-enabled
    text: '{{retarget_enabled}}'
    tooltip: '{{retarget_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: improved-tunnelers.retarget.range
    name: improved-tunnelers-retarget-range
    text: '{{retarget_range}}'
    tooltip: '{{retarget_range_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 80
      min: 20
      max: 200
      step: 10
  - url: improved-tunnelers.retarget.max
    name: improved-tunnelers-retarget-max
    text: '{{retarget_max}}'
    tooltip: '{{retarget_max_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 10
      min: 1
      max: 30
      step: 1

- display: GroupBox
  category: ['{{balance_changes}}']
  header: '{{targets_group}}'
  hasHeader: true
  children:
  - url: improved-tunnelers.targets.towers_and_gates
    name: improved-tunnelers-targets-towers-and-gates
    text: '{{targets_enabled}}'
    tooltip: '{{targets_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true

- display: GroupBox
  category: ['{{balance_changes}}']
  header: '{{ui_group}}'
  hasHeader: true
  children:
  - url: improved-tunnelers.targets.under_buildings
    name: improved-tunnelers-targets-under-buildings
    text: '{{targets_under}}'
    tooltip: '{{targets_under_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: improved-tunnelers.digging.unselectable
    name: improved-tunnelers-digging-unselectable
    text: '{{digging_unselectable}}'
    tooltip: '{{digging_unselectable_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: improved-tunnelers.digging.untargetable
    name: improved-tunnelers-digging-untargetable
    text: '{{digging_untargetable}}'
    tooltip: '{{digging_untargetable_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: improved-tunnelers.collapse.damage
    name: improved-tunnelers-collapse-damage
    text: '{{collapse_damage}}'
    tooltip: '{{collapse_damage_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 2500
      min: 1
      max: 10000
  - url: improved-tunnelers.collapse.spread
    name: improved-tunnelers-collapse-spread
    text: '{{collapse_spread}}'
    tooltip: '{{collapse_spread_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: improved-tunnelers.collapse.speed
    name: improved-tunnelers-collapse-speed
    text: '{{collapse_speed}}'
    tooltip: '{{collapse_speed_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 2
      min: 1
      max: 100
  - url: improved-tunnelers.collapse.spread_radius
    name: improved-tunnelers-collapse-spread-radius
    text: '{{collapse_spread_radius}}'
    tooltip: '{{collapse_spread_radius_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 2
      min: 0
      max: 8
  - url: improved-tunnelers.collapse.spread_damage
    name: improved-tunnelers-collapse-spread-damage
    text: '{{collapse_spread_damage}}'
    tooltip: '{{collapse_spread_damage_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 60
      min: 0
      max: 1000
  - url: improved-tunnelers.ui.enabled
    name: improved-tunnelers-ui-enabled
    text: '{{ui_enabled}}'
    tooltip: '{{ui_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true

- display: GroupBox
  category: ['{{bugfixes}}']
  header: '{{stances_group}}'
  hasHeader: true
  children:
  - url: improved-tunnelers.stances.enabled
    name: improved-tunnelers-stances-enabled
    text: '{{stances_enabled}}'
    tooltip: '{{stances_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true

- display: GroupBox
  category: ['{{ai}}', '{{improvements}}']
  header: '{{raids_group}}'
  hasHeader: true
  children:
  - url: improved-tunnelers.raids.enabled
    name: improved-tunnelers-raids-enabled
    text: '{{raids_enabled}}'
    tooltip: '{{raids_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true

- display: GroupBox
  category: ['{{misc}}']
  header: '{{diagnostics_group}}'
  hasHeader: true
  children:
  - url: improved-tunnelers.diagnostics.enabled
    name: improved-tunnelers-diagnostics-enabled
    text: '{{diagnostics_enabled}}'
    tooltip: '{{diagnostics_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: false
