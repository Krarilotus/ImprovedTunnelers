meta:
  version: 1.0.0
options:
- display: GroupBox
  category: [Improved Tunnelers]
  header: '{{denial_group}}'
  text: '{{denial_group_descr}}'
  hasHeader: true
  children:
  - url: improved-tunnelers.denial.enabled
    name: improved-tunnelers-denial-enabled
    text: '{{denial_enabled}}'
    tooltip: '{{denial_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: improved-tunnelers.denial.message
    name: improved-tunnelers-denial-message
    text: '{{denial_message}}'
    tooltip: '{{denial_message_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: improved-tunnelers.denial.seconds
    name: improved-tunnelers-denial-seconds
    text: '{{denial_seconds}}'
    tooltip: '{{denial_seconds_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 30
      min: 1
      max: 300
      step: 1

