meta:
  version: 1.0.0
options:
- display: GroupBox
  hasHeader: true
  header: '{{denial_group}}'
  children:
  - url: improved-tunnelers.denial
    name: improved-tunnelers-denial-duration
    header: '{{denial_enabled}}'
    text: '{{denial_enabled_tooltip}}'
    hasHeader: true
    display: UCP2Slider
    contents:
      value:
        enabled: false
        sliderValue: 100
      min: 1
      max: 2400
      step: 1
      decimals: 0
  - url: improved-tunnelers.denial.message
    name: improved-tunnelers-denial-message
    header: '{{denial_message}}'
    text: '{{denial_message_tooltip}}'
    hasHeader: true
    display: UCP2Switch
    contents:
      type: boolean
      value: false
  category:
  - '{{balance_changes}}'
- url: improved-tunnelers.terrain.enabled
  name: improved-tunnelers-terrain-enabled
  header: '{{terrain_enabled}}'
  text: '{{terrain_enabled_tooltip}}'
  hasHeader: true
  display: UCP2Switch
  contents:
    type: boolean
    value: false
  category:
  - '{{bugfixes}}'
- url: improved-tunnelers.retarget.enabled
  name: improved-tunnelers-retarget-enabled
