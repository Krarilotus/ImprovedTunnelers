    value: false
  category:
  - '{{ai}}'
  - '{{improvements}}'
- url: improved-tunnelers.retarget.range
  name: improved-tunnelers-retarget-range
  display: Number
  contents:
    type: integer
    value: 80
    min: 20
    max: 200
    step: 10
  hidden: true
- url: improved-tunnelers.retarget.max
  name: improved-tunnelers-retarget-max
  display: Number
  contents:
    type: integer
    value: 10
    min: 1
    max: 30
    step: 1
  hidden: true
- url: improved-tunnelers.retarget.join_distance
  name: improved-tunnelers-retarget-join-distance
  display: Number
  contents:
    type: integer
    value: 15
    min: 0
    max: 80
    step: 1
  hidden: true
- url: improved-tunnelers.collapse.damage
  name: improved-tunnelers-collapse-damage
  display: Number
  contents:
    type: integer
    value: 2500
    min: 1
    max: 10000
  hidden: true
- url: improved-tunnelers.collapse.tiles_per_second
  name: improved-tunnelers-collapse-tiles-per-second
  display: Number
  contents:
    type: integer
    value: 80
    min: 1
    max: 4000
  hidden: true
- url: improved-tunnelers.collapse.spread_radius
  name: improved-tunnelers-collapse-spread-radius
  display: Number
  contents:
    type: integer
    value: 2
    min: 0
    max: 8
  hidden: true
- url: improved-tunnelers.collapse.spread_damage
  name: improved-tunnelers-collapse-spread-damage
  display: Number
  contents:
    type: integer
    value: 60
    min: 0
    max: 1000
  hidden: true
- url: improved-tunnelers.diagnostics.enabled
  name: improved-tunnelers-diagnostics-enabled
  hasHeader: true
  display: UCP2Switch
  contents:
    type: boolean
    value: false
  hidden: true
