denial_group: Gedikten sonra inşaat
denial_enabled: İnşaat ve onarım bekleme süresi (tik)
denial_enabled_tooltip: |-
  Gediğin çevresinde inşaatı ve duvar onarımını kısa süre engeller. Varsayılan: 100 tik (normal hızda 2,5 saniye). En fazla: 2400 tik. Yeni çökmeler süreyi uzatır. Kapatıldığında hemen yeniden inşa edilebilir.
denial_message: İnşaat engelini açıkla
denial_message_tooltip: |-
  Bir gedik inşaatı engellediğinde mesaj gösterir.
terrain_enabled: Kazıdan sonra zemini düzelt
terrain_enabled_tooltip: |-
  Biten tünellerin çevresindeki zemini eski yüksekliğine getirir. Kapalıyken oyunun özgün temizliği kullanılır.
retarget_enabled: Gediklerden devam et
retarget_enabled_tooltip: |-
  Tünelleri koordine eder ve önceki hedef yok olmuşsa yeni hedef arar.
targets_group: Tünel hedefleri
targets_enabled: Kuleleri ve kapıları hedefle
targets_enabled_tooltip: |-
  Tüm kule ve kapıların tünel hedefi olmasına izin verir.
ui_group: Tünelci komutları ve çökme hasarı
targets_under: Şehir binalarının altından kaz
targets_under_tooltip: |-
  Sıradan binaların altından geçmeye izin verir. İç kale hariçtir.
digging_unselectable: Kazı yapan tünelcileri seçimde atla
digging_unselectable_tooltip: |-
  Asker seçimi veya grup emirleriyle kazının kesilmesini önler.
digging_untargetable: Yeraltındaki tünelcileri koru
digging_untargetable_tooltip: |-
  Kazı sırasında düşmanların tünelcileri hedeflemesini önler.
collapse_enabled: Tüneller hedefe hasar verir
collapse_enabled_tooltip: |-
  Tünelin ucundaki duvar, kule veya kapı, orijinal oyundaki gibi hemen yıkılmak yerine aşağıdaki hasarı alır.
collapse_damage: Hedefe verilen hasar
collapse_spread: Yakındaki binalara hasar ver
collapse_spread_tooltip: |-
  Tünelin yanındaki sıradan binalara hasar verir. Yakındaki tahkimatlar hariçtir.
ui_enabled: «Buraya saldır» düğmesi ekle
ui_enabled_tooltip: |-
  Kazı düğmesini korur ve ayrı bir bina saldırı komutu ekler.
stances_enabled: Savunma ve saldırgan duruşları aç
stances_enabled_tooltip: |-
  Boştaki tünelciler kazı veya hareket emirlerini kesmeden yakındaki düşmanlara tepki verir.
raids_enabled: Baskın tünelcilerini aç
raids_enabled_tooltip: |-
  Yapay zekânın baskın ayarlarında seçilen tünelciler baskın birliklerine katılır.
balance_changes: Denge değişiklikleri
bugfixes: Hata düzeltmeleri
ai: Yapay zekâ
improvements: İyileştirmeler
digging_trap_proof: Tünelciler ölüm çukurlarını yok sayar
digging_trap_proof_tooltip: |-
  Yer altındaki tünelciler ölüm çukurlarından hasar almaz ve onları tetiklemez.
digging_overlay: Yüksek zemin altındaki tünellerini göster
digging_overlay_tooltip: |-
  Kendi tünelin yükseltilmiş zeminin altından geçtiğinde oyun yüzeyde bir kabarıklık göstermez. Bu kareler kazı sürerken planlanmış bir hendek gibi kırmızıyla işaretlenir; tünel çöktükçe işaret kalkar. Kendi tünellerini yalnızca sen görürsün.
collapse_entrance_lost: Yıkılan giriş tüneli çökertir
collapse_entrance_lost_tooltip: |-
  Tünel kazılırken girişi yıkılırsa, tünel ulaştığı yerde çöker ve üstündekine bir hedefe ulaşmış gibi hasar verir.

