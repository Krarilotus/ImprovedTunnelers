denial_group: Строительство после бреши
denial_enabled: Задержка строительства и ремонта (тики)
denial_enabled_tooltip: |-
  Временно запрещает строительство и ремонт стен возле бреши. По умолчанию: 100 тиков (2,5 секунды при обычной скорости). Максимум: 2400 тиков. Новые обвалы продлевают задержку. Отключите для немедленного восстановления.
denial_message: Объяснять запрет строительства
denial_message_tooltip: |-
  Показывать сообщение, если брешь мешает строительству.
terrain_group: Грунт над подкопом
terrain_enabled: Восстанавливать грунт после подкопа
terrain_enabled_tooltip: |-
  Возвращает исходную высоту земли вокруг завершённых подкопов. По умолчанию включено. При отключении используется очистка исходной игры.
retarget_group: Маршруты подкопов
retarget_enabled: Продолжать подкоп через бреши
retarget_enabled_tooltip: |-
  Координирует подкопы и ищет новую цель, если прежняя уничтожена.
retarget_range: Дальность поиска (клетки)
retarget_range_tooltip: |-
  Расстояние поиска следующей цели. По умолчанию: 80.
retarget_max: Максимум новых целей
retarget_max_tooltip: |-
  Сколько раз один подкоп может продолжиться к новой цели. По умолчанию: 10.
targets_group: Цели подкопов
targets_enabled: Атаковать башни и ворота
targets_enabled_tooltip: |-
  Разрешает выбирать целью любые башни и ворота.
ui_group: Приказы подкопщикам и урон обвала
targets_under: Копать под городскими зданиями
targets_under_tooltip: |-
  Разрешает пути под обычными зданиями. Цитадели исключены.
digging_unselectable: Пропускать копающих подкопщиков при выделении
digging_unselectable_tooltip: |-
  Не прерывать подкоп выделением войск или групповыми приказами.
digging_untargetable: Защищать подкопщиков под землёй
digging_untargetable_tooltip: |-
  Не позволяет врагам выбирать целью подкопщиков во время подкопа.
collapse_damage: Урон цели
collapse_damage_tooltip: |-
  Урон стене, башне или воротам в конце подкопа. По умолчанию: 2500.
collapse_spread: Повреждать соседние здания
collapse_spread_tooltip: |-
  Наносить урон обычным зданиям рядом с подкопом. Соседние укрепления исключены.
collapse_speed: Скорость обвала (клеток в секунду)
collapse_speed_tooltip: |-
  Как быстро обрушивается подкоп после удара, в клетках подкопа в секунду при обычной скорости игры: земля восстанавливается, а окрестности сотрясаются клетка за клеткой, от цели обратно к входу. Меньшее значение медленнее и распределяет работу во времени. По умолчанию: 80.
collapse_spread_radius: Радиус урона (клетки)
collapse_spread_radius_tooltip: |-
  Дальность урона вокруг подкопа. По умолчанию: 2.
collapse_spread_damage: Урон соседним зданиям
collapse_spread_damage_tooltip: |-
  Урон каждому обычному зданию в пределах радиуса. По умолчанию: 60.
ui_enabled: Добавить кнопку «Атаковать здесь»
ui_enabled_tooltip: |-
  Сохраняет кнопку подкопа и добавляет отдельный приказ атаковать здания.
stances_group: Стойки подкопщиков
stances_enabled: Включить оборонительную и агрессивную стойки
stances_enabled_tooltip: |-
  Свободные подкопщики реагируют на врагов поблизости, не прерывая подкоп или движение.
raids_group: Подкопщики в набегах ИИ
raids_enabled: Включить подкопщиков в набегах
raids_enabled_tooltip: |-
  Подкопщики, выбранные в настройках набегов ИИ, присоединяются к этим отрядам.
diagnostics_group: Диагностика
diagnostics_enabled: Записывать диагностические сообщения
diagnostics_enabled_tooltip: |-
  Записывать действия подкопов для поиска ошибок. По умолчанию выключено.
balance_changes: Изменения баланса
bugfixes: Исправления
ai: ИИ
improvements: Улучшения
misc: Разное
retarget_join: Дистанция объединения (клетки)
retarget_join_tooltip: |-
  Подкопы, начатые так близко к началу первого подкопа группы, идут к его цели и расходятся только оттуда. Более далёкие подкопы пробивают свою брешь. 0 = любое расстояние. По умолчанию: 15.
digging_trap_proof: Подкопщики не попадают в волчьи ямы
digging_trap_proof_tooltip: |-
  Подкопщики под землёй не получают урона от волчьих ям и не приводят их в действие.
digging_overlay: Показывать свои подкопы под возвышенностями
digging_overlay_tooltip: |-
  Там, где ваш подкоп проходит под возвышенностью, игра не показывает бугор на поверхности. Такие клетки отмечаются красным, как запланированный ров, пока идёт копка, а метка исчезает, когда подкоп обрушивается. Свои подкопы видите только вы.
collapse_entrance_lost: Разрушенный вход обрушивает подкоп
collapse_entrance_lost_tooltip: |-
  Если вход разрушен, пока подкоп ещё роют, подкоп обрушивается там, куда дошёл, и повреждает то, что стоит сверху, как при достижении цели.

