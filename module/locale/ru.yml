denial_group: Строительство после пролома
denial_enabled: Задержка строительства и ремонта (тики)
denial_enabled_tooltip: 'Временно запрещает строительство и ремонт стен у пролома. По умолчанию: 100 тиков (2,5 секунды при
  обычной скорости). Максимум: 2400 тиков. Новые обвалы продлевают задержку. Отключите для немедленного восстановления.'
denial_message: Объяснять запрет строительства
denial_message_tooltip: Показывать сообщение, если пролом мешает строительству.
terrain_group: Грунт над туннелем
terrain_enabled: Восстанавливать грунт после подкопа
terrain_enabled_tooltip: Возвращает исходную высоту земли вокруг завершённых туннелей. По умолчанию включено. При отключении
  используется очистка исходной игры.
retarget_group: Маршруты туннелей
retarget_enabled: Продолжать подкоп через проломы
retarget_enabled_tooltip: Координирует туннели и ищет новую цель, если прежняя уничтожена.
retarget_range: Дальность поиска (клетки)
retarget_range_tooltip: 'Расстояние поиска следующей цели. По умолчанию: 80.'
retarget_max: Максимум новых целей
retarget_max_tooltip: 'Сколько раз один туннель может продолжиться к новой цели. По умолчанию: 10.'
targets_group: Цели туннелей
targets_enabled: Атаковать башни и ворота
targets_enabled_tooltip: Разрешает выбирать целью любые башни и ворота.
ui_group: Приказы землекопам и урон обвала
targets_under: Копать под городскими зданиями
targets_under_tooltip: Разрешает пути под обычными зданиями. Главные замки исключены.
digging_unselectable: Пропускать копающих при выделении
digging_unselectable_tooltip: Не прерывать подкоп выделением войск или групповыми приказами.
digging_untargetable: Защищать землекопов под землёй
digging_untargetable_tooltip: Не позволяет врагам выбирать целью землекопов во время подкопа.
collapse_damage: Урон цели
collapse_damage_tooltip: 'Урон стене, башне или воротам в конце туннеля. По умолчанию: 2500.'
collapse_spread: Повреждать соседние здания
collapse_spread_tooltip: Наносить урон обычным зданиям рядом с туннелем. Соседние укрепления исключены.
collapse_speed: Работа обвала за тик
collapse_speed_tooltip: 'Ограничивает новые клетки туннеля и операции урона за тик. Меньшее значение распределяет работу во
  времени. По умолчанию: 2.'
collapse_spread_radius: Радиус урона (клетки)
collapse_spread_radius_tooltip: 'Дальность урона вокруг туннеля. По умолчанию: 2.'
collapse_spread_damage: Урон соседним зданиям
collapse_spread_damage_tooltip: 'Урон каждому обычному зданию в пределах радиуса. По умолчанию: 60.'
ui_enabled: Добавить кнопку «Атаковать здесь»
ui_enabled_tooltip: Сохраняет кнопку подкопа и добавляет отдельный приказ атаковать здания.
stances_group: Режимы землекопов
stances_enabled: Включить оборонительный и агрессивный режимы
stances_enabled_tooltip: Свободные землекопы реагируют на врагов поблизости, не прерывая подкоп или движение.
raids_group: Землекопы в набегах ИИ
raids_enabled: Включить землекопов в набегах
raids_enabled_tooltip: Землекопы, выбранные в настройках набегов ИИ, присоединяются к этим отрядам.
diagnostics_group: Диагностика
diagnostics_enabled: Записывать диагностические сообщения
diagnostics_enabled_tooltip: Записывать действия туннелей для поиска ошибок. По умолчанию выключено.
balance_changes: Balance Changes
bugfixes: Bugfixes
ai: AI
improvements: Improvements
misc: Miscellaneous
