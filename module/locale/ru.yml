denial_group: Запрет строительства после пролома
denial_group_descr: После успешного обрушения игрок и ИИ временно не могут застроить пролом. Следующие
  туннели продлевают запрет; обрушение под пустой землёй его не создаёт. Используются обычные радиусы
  близости врага.
denial_enabled: Запретить строительство возле свежего пролома
denial_enabled_tooltip: 'Выкл.: после обрушения нет дополнительного запрета строительства.'
denial_message: Объяснять отказ в строительстве
denial_message_tooltip: Text Resource Modifier выводит сообщение о неустойчивой земле на языке игры. Если
  это невозможно, сохраняется исходное сообщение.
denial_seconds: Длительность запрета (секунды)
denial_seconds_tooltip: 'Игровое время при обычной скорости, измеряемое тактами. Следующий туннель добавляет
  эту длительность. По умолчанию: 120.'
retarget_group: Маршрут туннелей
retarget_group_descr: Туннели одной осады сходятся у пролома и идут общим маршрутом к вражескому костру.
  Они обходят замок и переназначают уничтоженные цели. Каждый туннель выполняет не более одного поиска
  за такт.
retarget_enabled: Объединять туннели и продолжать путь за проломом
retarget_enabled_tooltip: 'Выкл.: каждый туннель сохраняет исходную цель, даже уже уничтоженную.'
retarget_range: Дальность туннеля (клетки)
retarget_range_tooltip: 'Дальность поиска общей точки и следующих целей. Далёкие туннели образуют отдельную
  группу. По умолчанию: 80.'
retarget_max: Максимум перенаправлений туннеля
retarget_max_tooltip: 'Сколько раз туннель может получить новую цель после прибытия на пустое место. По
  умолчанию: 10.'
targets_under: Копать под городом
targets_under_tooltip: Разрешает проход под обычными зданиями. Целями остаются укрепления; замок обходится.
digging_unselectable: Не выделять копающих туннельщиков
digging_unselectable_tooltip: Мышь, рамка выделения и групповые приказы пропускают копающих туннельщиков.
  На поверхности они снова доступны для выделения.
digging_untargetable: Не атаковать копающих туннельщиков
digging_untargetable_tooltip: Обычная проверка целей игры игнорирует туннельщиков во время работы.
collapse_damage: Урон обрушения
collapse_damage_tooltip: 'Урон цели через обычную систему игры. Уцелевшие здания сохраняют повреждения.
  По умолчанию: 2500.'
collapse_spread: Повреждать здания рядом с туннелем
collapse_spread_tooltip: Толчки повреждают соседние обычные здания, но не укрепления. Укрепления прямо
  над туннелем получают обычный урон от его маршрута.
collapse_speed: Скорость обрушения (клетки за такт)
collapse_speed_tooltip: 'Туннель обрушивается от цели к входу. Меньшее значение замедляет процесс. По
  умолчанию: 2.'
collapse_spread_radius: Дальность толчков (клетки)
collapse_spread_radius_tooltip: 'Расстояние по обе стороны туннеля, на котором повреждаются обычные здания.
  По умолчанию: 2.'
collapse_spread_damage: Урон рядом с туннелем
collapse_spread_damage_tooltip: 'Урон обычным зданиям в радиусе толчков. Укрепления не получают дополнительного
  урона. По умолчанию: 60.'
targets_group: Цели туннелей
targets_group_descr: Добавляет ворота и башни в список целей. Обычные здания и склады не становятся целями.
  Замок остаётся защищённым.
targets_enabled: Разрешить цели в виде башен и ворот
targets_enabled_tooltip: 'Выкл.: исходный выбор стен и трёх малых башен.'
ui_group: Приказ атаки для туннельщиков
ui_group_descr: Сдвигает кнопку туннеля на одно место и добавляет обычную кнопку атаки. Изображения, подсказки
  и команды обеих кнопок сохраняются.
ui_enabled: Переместить кнопку туннеля и добавить атаку
ui_enabled_tooltip: 'Выкл.: исходная панель приказов игры.'
raids_group: Туннельщики в набегах ИИ
raids_group_descr: Туннельщики из RaidUnit1-8 присоединяются к группе булавоносцев и копейщиков для набега.
  Они сражаются на поверхности; осадные туннели остаются отдельно. Без гильдии туннельщиков ИИ выбирает
  следующего бойца набега.
raids_enabled: Разрешить туннельщиков в набегах ИИ
raids_enabled_tooltip: 'Выкл.: исходное отсутствие назначения туннельщиков в группу набега.'
stances_group: Режимы поведения
stances_group_descr: Бездействующие или ожидающие туннельщики реагируют согласно оборонительному или агрессивному
  режиму группы. Передвижение и работа сохраняют свои приказы. Дальности реакции берутся из игры.
stances_enabled: Учитывать оборонительный и агрессивный режимы
stances_enabled_tooltip: 'Выкл.: исходное поведение без автоматической реакции по режиму.'
diagnostics_group: Диагностика
diagnostics_group_descr: Записывает технические события прибытия, поиска и строительства в ucp3.log. Для
  обычной игры оставьте выключенной.
diagnostics_enabled: Записывать диагностику туннелей
diagnostics_enabled_tooltip: 'По умолчанию: выкл. Записывает события и не более одной ближайшей попытки
  строительства в секунду.'
module_name: Улучшенные туннельщики
