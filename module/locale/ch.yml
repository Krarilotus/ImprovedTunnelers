denial_group: 打开缺口后的建造
denial_enabled: 建造和修墙延迟（游戏刻）
denial_enabled_tooltip: |-
  短暂禁止在缺口附近建造和修墙。默认：100 刻（正常速度下 2.5 秒），上限 2400 刻。再次坍塌会延长时间。关闭后可立即重建。
denial_message: 说明建造受阻原因
denial_message_tooltip: |-
  缺口导致无法建造时显示提示。
terrain_group: 隧道地形
terrain_enabled: 挖掘后恢复地面
terrain_enabled_tooltip: |-
  恢复已完成隧道周围的原始地面高度。关闭则使用原版清理方式。
retarget_group: 隧道路线
retarget_enabled: 穿过缺口继续挖掘
retarget_enabled_tooltip: |-
  协调隧道，并在原目标已被摧毁时寻找新目标。
retarget_range: 搜索范围（格）
retarget_range_tooltip: |-
  寻找下一个目标的距离。默认：80。
retarget_max: 新目标上限
retarget_max_tooltip: |-
  一条隧道可转向新目标的次数。默认：10。
targets_group: 隧道目标
targets_enabled: 攻击塔楼和城门
targets_enabled_tooltip: |-
  允许将所有塔楼和城门作为隧道目标。
ui_group: 隧道工指令与坍塌伤害
targets_under: 从城镇建筑下方挖掘
targets_under_tooltip: |-
  允许经过普通建筑下方，主堡除外。
digging_unselectable: 选择部队时跳过正在挖掘的隧道工
digging_unselectable_tooltip: |-
  避免部队选择或群体命令打断挖掘。
digging_untargetable: 保护地下隧道工
digging_untargetable_tooltip: |-
  挖掘期间敌人无法瞄准隧道工。
collapse_enabled: 隧道对目标造成伤害
collapse_enabled_tooltip: |-
  隧道终点的城墙、塔楼或城门承受下方设定的伤害，而不是像原版游戏那样被直接摧毁。
collapse_damage: 目标伤害
collapse_damage_tooltip: |-
  对隧道终点的城墙、塔楼或城门造成的伤害。默认：2500。
collapse_spread: 损伤附近建筑
collapse_spread_tooltip: |-
  损伤隧道旁的普通建筑，不包括附近的防御工事。
collapse_speed: 坍塌速度（格/秒）
collapse_speed_tooltip: |-
  隧道命中后坍塌的速度，以正常游戏速度下每秒处理的隧道格数计：从目标向入口逐格恢复地面并震动周边。数值越低越慢，处理也越分散。默认：80。
collapse_spread_radius: 伤害半径（格）
collapse_spread_radius_tooltip: |-
  隧道两侧的伤害范围。默认：2。
collapse_spread_damage: 附近建筑伤害
collapse_spread_damage_tooltip: |-
  对范围内每座普通建筑造成的伤害。默认：60。
ui_enabled: 添加“攻击此处”按钮
ui_enabled_tooltip: |-
  保留挖掘按钮，并添加独立的建筑攻击指令。
stances_group: 隧道工姿态
stances_enabled: 启用防御和进攻姿态
stances_enabled_tooltip: |-
  空闲隧道工会应对附近敌人，不打断挖掘或移动命令。
raids_group: AI 袭扰中的隧道工
raids_enabled: 启用袭扰隧道工
raids_enabled_tooltip: |-
  AI 袭扰设置中选择的隧道工会加入袭扰部队。
diagnostics_group: 诊断
diagnostics_enabled: 记录诊断信息
diagnostics_enabled_tooltip: |-
  记录隧道活动以排查问题。默认关闭。
balance_changes: 平衡性改动
bugfixes: 错误修复
ai: AI
improvements: 改进
misc: 其他
retarget_join: 汇合距离（格）
retarget_join_tooltip: |-
  在一组第一条隧道起点这么近的范围内挖掘的隧道都会前往它的目标，只从那里再分开。更远的隧道会打开自己的缺口。0 = 不限距离。默认：15。
digging_trap_proof: 隧道工无视陷阱
digging_trap_proof_tooltip: |-
  地下的隧道工不会受到杀人坑伤害，也不会触发它们。
digging_overlay: 显示高地下的己方隧道
digging_overlay_tooltip: |-
  当你的隧道经过高地下方时，游戏不会在地面上显示隆起。挖掘期间，这些地块会像规划中的护城河一样标成红色，隧道坍塌时标记随之消失。只有你能看到自己的隧道。
collapse_entrance_lost: 入口被毁时隧道坍塌
collapse_entrance_lost_tooltip: |-
  如果隧道仍在挖掘时入口被摧毁，隧道会在挖到的位置坍塌，并像到达目标一样损坏上方的建筑。

tags.behavior: 行为
tags.bugfixes: 错误修复
tags.balance: 平衡
tags.interface: 界面
