denial_group: 突破后的建造
denial_enabled: 建造和修墙延迟（游戏刻）
denial_enabled_tooltip: 短暂禁止在缺口附近建造和修墙。默认：100刻（正常速度下2.5秒），上限2400刻。再次坍塌会延长时间。关闭后可立即重建。
denial_message: 说明建造受阻原因
denial_message_tooltip: 缺口导致无法建造时显示提示。
terrain_group: 地道地形
terrain_enabled: 挖掘后恢复地面
terrain_enabled_tooltip: 恢复已完成地道周围的原始地面高度。默认开启。关闭则使用原版清理方式。
retarget_group: 地道路线
retarget_enabled: 穿过缺口继续挖掘
retarget_enabled_tooltip: 协调地道，并在原目标已被摧毁时寻找新目标。
retarget_range: 搜索范围（格）
retarget_range_tooltip: 寻找下一个目标的距离。默认：80。
retarget_max: 新目标上限
retarget_max_tooltip: 一条地道可转向新目标的次数。默认：10。
targets_group: 地道目标
targets_enabled: 攻击塔楼和城门
targets_enabled_tooltip: 允许将所有塔楼和城门作为地道目标。
ui_group: 掘地兵指令与坍塌伤害
targets_under: 从城镇建筑下方挖掘
targets_under_tooltip: 允许经过普通建筑下方，主堡除外。
digging_unselectable: 选择部队时跳过正在挖掘的掘地兵
digging_unselectable_tooltip: 避免部队选择或群体命令打断挖掘。
digging_untargetable: 保护地下掘地兵
digging_untargetable_tooltip: 挖掘期间敌人无法瞄准掘地兵。
collapse_damage: 目标伤害
collapse_damage_tooltip: 对地道终点的城墙、塔楼或城门造成的伤害。默认：2500。
collapse_spread: 损伤附近建筑
collapse_spread_tooltip: 损伤地道旁的普通建筑，不包括附近的防御工事。
collapse_speed: 每刻坍塌处理量
collapse_speed_tooltip: 限制每刻新增地道格数和伤害处理次数。较低数值会分散处理时间。默认：2。
collapse_spread_radius: 伤害半径（格）
collapse_spread_radius_tooltip: 地道两侧的伤害范围。默认：2。
collapse_spread_damage: 附近建筑伤害
collapse_spread_damage_tooltip: 对范围内每座普通建筑造成的伤害。默认：60。
ui_enabled: 添加“攻击此处”按钮
ui_enabled_tooltip: 保留挖掘按钮，并添加独立的建筑攻击指令。
stances_group: 掘地兵姿态
stances_enabled: 启用防御和进攻姿态
stances_enabled_tooltip: 空闲掘地兵会应对附近敌人，不打断挖掘或移动命令。
raids_group: AI袭扰中的掘地兵
raids_enabled: 启用袭扰掘地兵
raids_enabled_tooltip: AI袭扰设置中选择的掘地兵会加入袭扰部队。
diagnostics_group: 诊断
diagnostics_enabled: 记录诊断信息
diagnostics_enabled_tooltip: 记录地道活动以排查问题。默认关闭。
balance_changes: Balance Changes
bugfixes: Bugfixes
ai: AI
improvements: Improvements
misc: Miscellaneous
