denial_group: 突破后的建造禁区
denial_group_descr: 成功塌陷后，玩家和电脑暂时不能重建缺口。同一地点的后续隧道延长禁建时间；空地上的塌陷不会产生禁区。使用游戏原有的敌军接近判定半径。
denial_enabled: 禁止在新缺口附近建造
denial_enabled_tooltip: 关闭时，塌陷后不增加额外的建造限制。
denial_message: 显示无法建造的原因
denial_message_tooltip: Text Resource Modifier 使用游戏语言显示地面不稳定的提示。不可用时保留原有提示。
denial_seconds: 禁建时间（秒）
denial_seconds_tooltip: 按正常速度的游戏时间计算，以游戏逻辑帧计时。后续隧道再次增加该时长。默认：120。
retarget_group: 隧道路线
retarget_group_descr: 同一攻城行动的隧道汇聚到一个缺口，再沿共同路线向敌方篝火推进。路线绕开主堡；目标消失时重新选择。每条隧道每个逻辑帧最多搜索一次。
retarget_enabled: 汇聚隧道并穿过缺口继续前进
retarget_enabled_tooltip: 关闭时，每条隧道保留最初目标，即使目标已经被摧毁。
retarget_range: 隧道范围（格）
retarget_range_tooltip: 寻找汇合点和后续目标的距离。远处的隧道建立另一组汇合点。默认：80。
retarget_max: 每条隧道的最大重定向次数
retarget_max_tooltip: 到达空目标位置后允许重新选择目标的次数。默认：10。
targets_under: 允许从城镇下方挖掘
targets_under_tooltip: 可以经过普通建筑下方，目标仍然仅为防御工事，并绕开主堡。
digging_unselectable: 挖掘中的隧道兵不可选中
digging_unselectable_tooltip: 鼠标、框选和群体命令跳过正在挖掘的隧道兵。回到地面后恢复可选状态。
digging_untargetable: 挖掘中的隧道兵不受攻击
digging_untargetable_tooltip: 游戏原有的目标检查会忽略正在挖掘的隧道兵。
collapse_damage: 塌陷伤害
collapse_damage_tooltip: 通过游戏原有伤害系统攻击目标。未倒塌建筑保留损伤。默认：2500。
collapse_spread: 伤害隧道旁的建筑
collapse_spread_tooltip: 震动伤害附近的普通建筑，不额外伤害防御工事。隧道正上方的防御工事保留原有路径伤害。
collapse_speed: 塌陷速度（每逻辑帧格数）
collapse_speed_tooltip: 隧道从目标向入口依次塌陷。数值越小，速度越慢。默认：2。
collapse_spread_radius: 震动范围（格）
collapse_spread_radius_tooltip: 隧道两侧普通建筑受影响的距离。默认：2。
collapse_spread_damage: 隧道旁的伤害
collapse_spread_damage_tooltip: 震动范围内普通建筑受到的伤害。防御工事不受额外伤害。默认：60。
targets_group: 隧道目标
targets_group_descr: 将城门和塔楼加入目标范围。普通建筑和储物场不是目标，主堡仍受保护。
targets_enabled: 允许攻击塔楼和城门
targets_enabled_tooltip: 关闭时使用原有目标选择：城墙和三种小型塔楼。
ui_group: 隧道兵攻击命令
ui_group_descr: 将挖掘按钮移动一格，加入普通攻击按钮。两个按钮各自保留原有图标、提示和命令。
ui_enabled: 移动挖掘按钮并加入攻击按钮
ui_enabled_tooltip: 关闭时保留游戏原有命令面板。
raids_group: 电脑袭击队中的隧道兵
raids_group_descr: RaidUnit1-8 中的隧道兵加入链锤兵和长矛兵的袭击队，在地面战斗；攻城隧道仍独立运作。没有隧道兵公会时，电脑选择下一种袭击单位。
raids_enabled: 允许电脑袭击队使用隧道兵
raids_enabled_tooltip: 关闭时保留原版未将隧道兵分配到袭击队的行为。
stances_group: 作战姿态
stances_group_descr: 空闲或等待中的隧道兵按队伍的防御或进攻姿态作出反应。移动和挖掘保留其命令，反应距离取自游戏设置。
stances_enabled: 遵循防御和进攻姿态
stances_enabled_tooltip: 关闭时保留原版不按姿态自动反应的行为。
diagnostics_group: 诊断
diagnostics_group_descr: 将到达、搜索和建造相关的技术事件写入 ucp3.log。正常游戏请关闭。
diagnostics_enabled: 记录隧道诊断日志
diagnostics_enabled_tooltip: 默认关闭。记录隧道事件，以及每秒最多一次附近的建造尝试。
module_name: 改进隧道兵
