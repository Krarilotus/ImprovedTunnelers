collapse_enabled: Les tunnels endommagent leur cible
collapse_enabled_tooltip: 'Le mur, la tour ou la porte au bout du tunnel subit les dégâts ci-dessous au lieu d''être démoli d''un coup comme dans le jeu original.'
collapse_damage: Dégâts à la cible
collapse_spread: Endommager les bâtiments proches
