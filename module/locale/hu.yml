denial_group: Építés a rés megnyitása után
denial_enabled: Építési és javítási várakozás (tick)
denial_enabled_tooltip: |-
  Rövid ideig tiltja az építést és a faljavítást a rés körül. Alapértelmezett: 100 tick (normál sebességen 2,5 másodperc). Maximum: 2400 tick. Újabb omlások hosszabbítják. Kikapcsolva azonnal lehet újjáépíteni.
denial_message: Építési tiltás magyarázata
denial_message_tooltip: |-
  Üzenetet mutat, ha egy rés miatt nem lehet építeni.
terrain_enabled: Talaj helyreállítása ásás után
terrain_enabled_tooltip: |-
  Visszaállítja a befejezett alagutak körüli eredeti talajmagasságot. Kikapcsolva az eredeti játék helyreállítását használja.
retarget_enabled: Továbbásás a réseken át
retarget_enabled_tooltip: |-
  Összehangolja az alagutakat, és új célt keres, ha az előző megsemmisült.
targets_group: Alagútcélpontok
targets_enabled: Tornyok és kapuk célzása
targets_enabled_tooltip: |-
  Minden torony és kapu lehet alagútcélpont.
ui_group: Alagútásó-parancsok és omlási sebzés
targets_under: Ásás városi épületek alatt
targets_under_tooltip: |-
  Engedélyezi az útvonalat a közönséges épületek alatt. A vártornyok kivételek.
digging_unselectable: Ásó alagútásók kihagyása kijelöléskor
digging_unselectable_tooltip: |-
  A csapatkijelölés és a csoportparancs ne szakítsa meg az ásást.
digging_untargetable: Föld alatti alagútásók védelme
digging_untargetable_tooltip: |-
  Az ellenség nem célozhatja az alagútásókat ásás közben.
collapse_enabled: Az alagutak sebzik a célpontot
collapse_enabled_tooltip: |-
  Az alagút végén lévő fal, torony vagy kapu az alább megadott sebzést kapja, ahelyett hogy azonnal leomlana, mint az eredeti játékban.
collapse_damage: Célpont sebzése
collapse_spread: Közeli épületek sebzése
collapse_spread_tooltip: |-
  Sebzi az alagút melletti közönséges épületeket. A szomszédos erődítmények kivételek.
ui_enabled: „Támadás ide” gomb hozzáadása
ui_enabled_tooltip: |-
  Megtartja az ásás gombot, és külön épülettámadási parancsot ad hozzá.
stances_enabled: Védekező és támadó harci mód engedélyezése
stances_enabled_tooltip: |-
  A tétlen alagútásók reagálnak a közeli ellenségre az ásási és mozgási parancsok megszakítása nélkül.
raids_enabled: Portyázó alagútásók engedélyezése
raids_enabled_tooltip: |-
  Az MI portyabeállításaiban kiválasztott alagútásók csatlakoznak a portyázó csapatokhoz.
balance_changes: Egyensúlymódosítások
bugfixes: Hibajavítások
ai: MI
improvements: Fejlesztések
digging_trap_proof: Az alagútásók figyelmen kívül hagyják a csapdavermeket
digging_trap_proof_tooltip: |-
  A föld alatti alagútásók nem sérülnek a csapdavermektől, és nem is hozzák működésbe őket.
digging_overlay: Saját alagutak mutatása magaslatok alatt
digging_overlay_tooltip: |-
  Ahol a saját alagutad magasabb terep alatt halad, a játék nem mutat kidudorodást a felszínen. Ezeket a mezőket pirossal jelöli, mint egy tervezett várárkot, amíg az ásás tart, és a jelölés eltűnik, amikor az alagút beomlik. A saját alagutaidat csak te látod.
collapse_entrance_lost: Lerombolt bejárat beomlasztja az alagutat
collapse_entrance_lost_tooltip: |-
  Ha a bejáratot ásás közben lerombolják, az alagút ott omlik be, ahová eljutott, és megrongálja, ami fölötte áll, mintha célba ért volna.

