denial_group: ساخت‌وساز پس از شکاف
denial_enabled: تأخیر ساخت و تعمیر (تیک)
denial_enabled_tooltip: |-
  ساخت‌وساز و تعمیر دیوار کنار شکاف را کوتاه‌مدت متوقف می‌کند. پیش‌فرض: ۱۰۰ تیک (۲٫۵ ثانیه در سرعت عادی). حداکثر: ۲۴۰۰ تیک. ریزش‌های بعدی زمان را افزایش می‌دهند. با خاموش کردن، بازسازی فوری ممکن است.
denial_message: توضیح ممنوعیت ساخت
denial_message_tooltip: |-
  وقتی شکاف مانع ساخت می‌شود، پیام نشان دهد.
terrain_enabled: بازگردانی زمین پس از حفاری
terrain_enabled_tooltip: |-
  ارتفاع اصلی زمین اطراف تونل‌های تمام‌شده را بازمی‌گرداند. در حالت خاموش از پاک‌سازی بازی اصلی استفاده می‌شود.
retarget_enabled: ادامهٔ حفاری از شکاف‌ها
retarget_enabled_tooltip: |-
  تونل‌ها را هماهنگ می‌کند و پس از نابودی هدف قبلی، هدف تازه می‌یابد.
targets_group: هدف تونل‌ها
targets_enabled: هدف‌گیری برج‌ها و دروازه‌ها
targets_enabled_tooltip: |-
  همهٔ برج‌ها و دروازه‌ها می‌توانند هدف تونل باشند.
ui_group: فرمان‌های تونل‌کن و آسیب ریزش
targets_under: حفاری زیر ساختمان‌های شهر
targets_under_tooltip: |-
  عبور از زیر ساختمان‌های عادی را مجاز می‌کند. دژ مرکزی مستثناست.
digging_unselectable: نادیده گرفتن تونل‌کن‌های مشغول حفاری در انتخاب
digging_unselectable_tooltip: |-
  انتخاب سربازان و فرمان گروهی حفاری را قطع نکند.
digging_untargetable: محافظت از تونل‌کن‌های زیر زمین
digging_untargetable_tooltip: |-
  دشمنان هنگام حفاری نمی‌توانند تونل‌کن‌ها را هدف بگیرند.
collapse_enabled: تونل‌ها به هدف آسیب می‌زنند
collapse_enabled_tooltip: |-
  دیوار، برج یا دروازهٔ انتهای تونل به جای تخریب فوری مانند بازی اصلی، آسیب تعیین‌شده در پایین را می‌گیرد.
collapse_damage: آسیب به هدف
collapse_spread: آسیب به ساختمان‌های نزدیک
collapse_spread_tooltip: |-
  به ساختمان‌های عادی کنار تونل آسیب می‌زند. استحکامات مجاور مستثنا هستند.
ui_enabled: افزودن دکمهٔ «حمله به اینجا»
ui_enabled_tooltip: |-
  دکمهٔ حفاری را نگه می‌دارد و فرمان جداگانهٔ حمله به ساختمان اضافه می‌کند.
stances_enabled: فعال‌سازی حالت دفاعی و تهاجمی
stances_enabled_tooltip: |-
  تونل‌کن‌های بیکار بدون قطع حفاری یا حرکت به دشمنان نزدیک واکنش نشان می‌دهند.
raids_enabled: فعال‌سازی تونل‌کن‌های یورش
raids_enabled_tooltip: |-
  تونل‌کن‌های انتخاب‌شده در تنظیمات یورش هوش مصنوعی به نیروهای یورش می‌پیوندند.
balance_changes: تغییرات توازن
bugfixes: رفع خطاها
ai: هوش مصنوعی
improvements: بهبودها
digging_trap_proof: تونل‌کن‌ها گودال‌های مرگ را نادیده می‌گیرند
digging_trap_proof_tooltip: |-
  تونل‌کن‌های زیر زمین از گودال‌های مرگ آسیب نمی‌بینند و آن‌ها را فعال نمی‌کنند.
digging_overlay: نمایش تونل‌های خودتان زیر زمین بلند
digging_overlay_tooltip: |-
  جایی که تونل شما از زیر زمین مرتفع می‌گذرد، بازی هیچ برآمدگی روی سطح نشان نمی‌دهد. این خانه‌ها هنگام کندن، مانند خندقی برنامه‌ریزی‌شده، قرمز علامت می‌خورند و با فرو ریختن تونل علامت برداشته می‌شود. فقط خودتان تونل‌هایتان را می‌بینید.
collapse_entrance_lost: ویرانی ورودی تونل را فرو می‌ریزد
collapse_entrance_lost_tooltip: |-
  اگر ورودی هنگام حفاری ویران شود، تونل در جایی که رسیده فرو می‌ریزد و به آنچه بالای آن است آسیب می‌زند، گویی به هدف رسیده است.

