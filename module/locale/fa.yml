denial_group: ممنوعیت ساخت‌وساز پس از شکاف
denial_group_descr: پس از فروریختن موفق، ساخت‌وساز در شکاف برای بازیکن و هوش مصنوعی موقتاً ممنوع می‌شود.
  تونل‌های بعدی زمان را افزایش می‌دهند؛ فروریختن زیر زمین خالی ممنوعیتی ایجاد نمی‌کند. شعاع معمول نزدیکی
  دشمن در بازی استفاده می‌شود.
denial_enabled: جلوگیری از ساخت‌وساز کنار شکاف تازه
denial_enabled_tooltip: 'خاموش: پس از فروریختن، ممنوعیت اضافی اعمال نمی‌شود.'
denial_message: نمایش دلیل رد شدن ساخت‌وساز
denial_message_tooltip: Text Resource Modifier پیام زمین ناپایدار را به زبان بازی نشان می‌دهد. اگر در
  دسترس نباشد، پیام اصلی حفظ می‌شود.
denial_seconds: مدت ممنوعیت (ثانیه)
denial_seconds_tooltip: 'زمان بازی با سرعت عادی، برحسب گام‌های بازی. تونل بعدی همین مدت را اضافه می‌کند.
  پیش‌فرض: 120.'
retarget_group: مسیر تونل‌ها
retarget_group_descr: تونل‌های یک محاصره در یک شکاف جمع می‌شوند و مسیر مشترکی را به‌سوی آتش اردوگاه دشمن
  ادامه می‌دهند. دور قلعهٔ اصلی می‌روند و در صورت نیاز هدف را عوض می‌کنند. هر تونل در هر گام حداکثر یک
  جست‌وجو انجام می‌دهد.
retarget_enabled: جمع شدن تونل‌ها و ادامه از شکاف
retarget_enabled_tooltip: 'خاموش: هر تونل هدف اولیه را نگه می‌دارد، حتی اگر نابود شده باشد.'
retarget_range: برد تونل (خانه)
retarget_range_tooltip: 'فاصلهٔ جست‌وجوی محل تجمع و هدف‌های بعدی. تونل‌های دور گروه دیگری تشکیل می‌دهند.
  پیش‌فرض: 80.'
retarget_max: حداکثر تغییر مسیر هر تونل
retarget_max_tooltip: 'تعداد دفعاتی که تونل پس از رسیدن به هدف خالی می‌تواند هدف تازه بگیرد. پیش‌فرض:
  10.'
targets_under: حفاری زیر شهر
targets_under_tooltip: عبور زیر ساختمان‌های معمولی را مجاز می‌کند. هدف‌ها همچنان استحکامات هستند و قلعهٔ
  اصلی دور زده می‌شود.
digging_unselectable: نقب‌زنان در حال حفاری انتخاب نشوند
digging_unselectable_tooltip: ماوس، کادر انتخاب و فرمان‌های گروهی نقب‌زنان در حال حفاری را نادیده می‌گیرند.
  روی سطح دوباره قابل انتخاب می‌شوند.
digging_untargetable: نقب‌زنان در حال حفاری هدف قرار نگیرند
digging_untargetable_tooltip: بررسی معمول هدف در بازی، نقب‌زنان در حال حفاری را نادیده می‌گیرد.
collapse_damage: آسیب فروریختن
collapse_damage_tooltip: 'آسیب به هدف با سامانهٔ معمول بازی. ساختمان‌های باقی‌مانده آسیب را حفظ می‌کنند.
  پیش‌فرض: 2500.'
collapse_spread: آسیب به ساختمان‌های کنار تونل
collapse_spread_tooltip: لرزش به ساختمان‌های معمولی اطراف آسیب می‌زند، نه استحکامات. استحکامات درست بالای
  تونل آسیب معمول مسیر را می‌گیرند.
collapse_speed: سرعت فروریختن (خانه در هر گام)
collapse_speed_tooltip: 'تونل از هدف به‌سمت ورودی فرومی‌ریزد. مقدار کمتر کندتر است. پیش‌فرض: 2.'
collapse_spread_radius: برد لرزش (خانه)
collapse_spread_radius_tooltip: 'فاصلهٔ اثر بر ساختمان‌های معمولی در دو طرف تونل. پیش‌فرض: 2.'
collapse_spread_damage: آسیب کنار تونل
collapse_spread_damage_tooltip: 'آسیب ساختمان‌های معمولی در برد لرزش. استحکامات آسیب اضافه نمی‌گیرند.
  پیش‌فرض: 60.'
targets_group: هدف‌های تونل
targets_group_descr: دروازه‌ها و برج‌ها را به هدف‌ها اضافه می‌کند. ساختمان‌های معمولی و انبارها هدف نیستند.
  قلعهٔ اصلی محافظت می‌شود.
targets_enabled: برج‌ها و دروازه‌ها هدف باشند
targets_enabled_tooltip: 'خاموش: انتخاب هدف اصلی برای دیوارها و سه برج کوچک.'
ui_group: فرمان حمله برای نقب‌زنان
ui_group_descr: دکمهٔ تونل را یک خانه جابه‌جا و دکمهٔ حملهٔ عادی را اضافه می‌کند. تصویر، راهنما و فرمان
  هر دو دکمه حفظ می‌شود.
ui_enabled: جابه‌جایی دکمهٔ تونل و افزودن حمله
ui_enabled_tooltip: 'خاموش: پنل فرمان اصلی بازی حفظ می‌شود.'
raids_group: نقب‌زنان در یورش‌های هوش مصنوعی
raids_group_descr: نقب‌زنان RaidUnit1-8 به گروه یورش گرزداران و نیزه‌داران می‌پیوندند و روی سطح می‌جنگند.
  تونل‌های محاصره جدا می‌مانند. بدون انجمن نقب‌زنان، هوش مصنوعی واحد بعدی یورش را انتخاب می‌کند.
raids_enabled: اجازهٔ نقب‌زنان در یورش هوش مصنوعی
raids_enabled_tooltip: 'خاموش: رفتار اصلی که نقب‌زنان را به گروه یورش اختصاص نمی‌دهد.'
stances_group: حالت‌های نبرد
stances_group_descr: نقب‌زنان بیکار یا منتظر مطابق حالت دفاعی یا تهاجمی گروه واکنش نشان می‌دهند. حرکت
  و حفاری فرمان خود را حفظ می‌کنند. برد واکنش از بازی گرفته می‌شود.
stances_enabled: پیروی از حالت دفاعی و تهاجمی
stances_enabled_tooltip: 'خاموش: رفتار اصلی بدون واکنش خودکار بر پایهٔ حالت.'
diagnostics_group: عیب‌یابی
diagnostics_group_descr: رویدادهای فنی رسیدن، جست‌وجو و ساخت‌وساز را در ucp3.log می‌نویسد. برای بازی عادی
  خاموش بماند.
diagnostics_enabled: ثبت گزارش عیب‌یابی تونل‌ها
diagnostics_enabled_tooltip: 'پیش‌فرض: خاموش. رویدادهای تونل و حداکثر یک تلاش ساخت‌وساز نزدیک در ثانیه
  را ثبت می‌کند.'
module_name: نقب‌زنان بهبودیافته
