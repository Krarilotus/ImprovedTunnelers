denial_group: Construcción tras una brecha
denial_enabled: Espera para construir y reparar (ticks)
denial_enabled_tooltip: 'Bloquea brevemente la construcción y reparación de murallas junto a una brecha. Predeterminado: 100
  ticks (2,5 segundos a velocidad normal). Máximo: 2400 ticks. Otros derrumbes prolongan la espera. Desactivado permite reconstruir
  de inmediato.'
denial_message: Explicar el bloqueo
denial_message_tooltip: Muestra un mensaje cuando una brecha impide construir.
terrain_group: Terreno de los túneles
terrain_enabled: Restaurar el suelo tras excavar
terrain_enabled_tooltip: Restaura la altura original alrededor de túneles terminados. Activado por defecto. Desactivado usa
  la limpieza del juego original.
retarget_group: Rutas de túneles
retarget_enabled: Continuar tras las brechas
retarget_enabled_tooltip: Coordina túneles y busca otro objetivo si el anterior ya no existe.
retarget_range: Alcance de búsqueda (casillas)
retarget_range_tooltip: 'Distancia para buscar el siguiente objetivo. Predeterminado: 80.'
retarget_max: Máximo de nuevos objetivos
retarget_max_tooltip: 'Veces que un túnel puede continuar hacia otro objetivo. Predeterminado: 10.'
targets_group: Objetivos de túneles
targets_enabled: Atacar torres y puertas
targets_enabled_tooltip: Permite elegir cualquier torre o puerta como objetivo.
ui_group: Órdenes y daño de túneles
targets_under: Excavar bajo edificios civiles
targets_under_tooltip: Permite rutas bajo edificios normales. Excluye los torreones principales.
digging_unselectable: Omitir excavadores al seleccionar
digging_unselectable_tooltip: Evita interrumpir la excavación al seleccionar tropas o dar órdenes de grupo.
digging_untargetable: Proteger excavadores bajo tierra
digging_untargetable_tooltip: Impide que los enemigos ataquen a los excavadores mientras cavan.
collapse_damage: Daño al objetivo
collapse_damage_tooltip: 'Daño a la muralla, torre o puerta al final del túnel. Predeterminado: 2500.'
collapse_spread: Dañar edificios cercanos
collapse_spread_tooltip: Daña edificios normales junto al túnel. Excluye fortificaciones vecinas.
collapse_speed: Trabajo de derrumbe por tick
collapse_speed_tooltip: 'Limita nuevas casillas y operaciones de daño por tick. Valores bajos reparten el trabajo. Predeterminado:
  2.'
collapse_spread_radius: Radio de daño (casillas)
collapse_spread_radius_tooltip: 'Alcance del daño alrededor del túnel. Predeterminado: 2.'
collapse_spread_damage: Daño a edificios cercanos
collapse_spread_damage_tooltip: 'Daño a cada edificio normal dentro del alcance. Predeterminado: 60.'
ui_enabled: Añadir botón «Atacar aquí»
ui_enabled_tooltip: Conserva el botón de excavar y añade una orden para atacar edificios.
stances_group: Posturas de excavadores
stances_enabled: Activar posturas defensiva y agresiva
stances_enabled_tooltip: Los excavadores inactivos reaccionan a enemigos cercanos sin interrumpir órdenes de movimiento o
  excavación.
raids_group: Excavadores en incursiones de la IA
raids_enabled: Activar excavadores en incursiones
raids_enabled_tooltip: Los excavadores elegidos en los ajustes de incursión de la IA se unen a esas tropas.
diagnostics_group: Diagnóstico
diagnostics_enabled: Escribir mensajes de diagnóstico
diagnostics_enabled_tooltip: Registra la actividad de túneles para investigar problemas. Desactivado por defecto.
balance_changes: Balance Changes
bugfixes: Bugfixes
ai: AI
improvements: Improvements
misc: Miscellaneous
