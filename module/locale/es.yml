denial_group: Bloqueo de construcción tras una brecha
denial_group_descr: Tras un derrumbe efectivo, la brecha queda temporalmente bloqueada para el jugador
  y la IA. Otros túneles prolongan el tiempo; un derrumbe en terreno vacío no crea bloqueo. Se usan los
  radios normales de proximidad enemiga.
denial_enabled: Impedir construir junto a una brecha reciente
denial_enabled_tooltip: 'Desactivado: no añade bloqueo de construcción tras el derrumbe.'
denial_message: Explicar por qué no se puede construir
denial_message_tooltip: Text Resource Modifier muestra un aviso de suelo inestable en el idioma del juego.
  Si no está disponible, se conserva el mensaje original.
denial_seconds: Duración del bloqueo (segundos)
denial_seconds_tooltip: 'Tiempo de juego a velocidad normal, contado en ticks. Otro túnel suma esta duración.
  Predeterminado: 120.'
retarget_group: Recorrido de los túneles
retarget_group_descr: Los túneles del mismo asedio convergen en una brecha y siguen una ruta común hacia
  la hoguera enemiga. Rodean la torre del homenaje y buscan otro objetivo cuando hace falta, como máximo
  una búsqueda por túnel y tick.
retarget_enabled: Reunir los túneles y continuar tras la brecha
retarget_enabled_tooltip: 'Desactivado: cada túnel conserva su objetivo inicial, aunque ya esté destruido.'
retarget_range: Alcance de los túneles (casillas)
retarget_range_tooltip: 'Distancia para buscar el punto de encuentro y siguientes objetivos. Los túneles
  lejanos forman otro grupo. Predeterminado: 80.'
retarget_max: Redirecciones máximas por túnel
retarget_max_tooltip: 'Veces que puede redirigirse un túnel al llegar a un objetivo vacío. Predeterminado:
  10.'
targets_under: Cavar bajo la ciudad
targets_under_tooltip: Permite pasar bajo edificios normales. Los objetivos siguen siendo fortificaciones;
  se rodea la torre del homenaje.
digging_unselectable: No seleccionar zapadores que estén cavando
digging_unselectable_tooltip: El ratón, la selección rectangular y las órdenes de grupo ignoran a los
  zapadores que cavan. Vuelven a ser seleccionables en superficie.
digging_untargetable: No atacar zapadores que estén cavando
digging_untargetable_tooltip: La comprobación normal de objetivos ignora a los zapadores mientras cavan.
collapse_damage: Daño del derrumbe
collapse_damage_tooltip: 'Daño al objetivo mediante el sistema normal del juego. Los edificios supervivientes
  conservan el daño. Predeterminado: 2500.'
collapse_spread: Dañar edificios junto al túnel
collapse_spread_tooltip: Los temblores afectan a edificios normales vecinos, no a fortificaciones. Las
  fortificaciones atravesadas directamente conservan el daño normal del recorrido.
collapse_speed: Velocidad de derrumbe (casillas por tick)
collapse_speed_tooltip: 'El túnel se derrumba desde el objetivo hacia la entrada. Un valor bajo es más
  lento. Predeterminado: 2.'
collapse_spread_radius: Alcance del temblor (casillas)
collapse_spread_radius_tooltip: 'Distancia a ambos lados del túnel que afecta a edificios normales. Predeterminado:
  2.'
collapse_spread_damage: Daño junto al túnel
collapse_spread_damage_tooltip: 'Daño a edificios normales dentro del alcance del temblor. Sin daño adicional
  a fortificaciones. Predeterminado: 60.'
targets_group: Objetivos de los túneles
targets_group_descr: Amplía los objetivos a puertas y torres. Los edificios normales y las reservas no
  son objetivos. La torre del homenaje sigue protegida.
targets_enabled: Permitir torres y puertas como objetivos
targets_enabled_tooltip: 'Desactivado: selección original de murallas y las tres torres pequeñas.'
ui_group: Orden de ataque para zapadores
ui_group_descr: Desplaza el botón de túnel una posición y añade el botón de ataque normal. Conserva las
  imágenes, ayudas y órdenes de ambos.
ui_enabled: Mover el botón de túnel y añadir ataque
ui_enabled_tooltip: 'Desactivado: panel de órdenes original.'
raids_group: Zapadores en incursiones de la IA
raids_group_descr: Los zapadores de RaidUnit1-8 se unen al grupo de incursión de maceros y lanceros. Combaten
  en superficie; los túneles de asedio siguen separados. Sin gremio de zapadores, la IA elige su siguiente
  unidad de incursión.
raids_enabled: Permitir zapadores en incursiones de la IA
raids_enabled_tooltip: 'Desactivado: falta de asignación original de zapadores a grupos de incursión.'
stances_group: Actitudes
stances_group_descr: Los zapadores inactivos o en espera reaccionan según la actitud defensiva o agresiva
  de su grupo. Los desplazamientos y excavaciones conservan sus órdenes. Los alcances de reacción proceden
  del juego.
stances_enabled: Respetar las actitudes defensiva y agresiva
stances_enabled_tooltip: 'Desactivado: comportamiento original sin reacción automática por actitud.'
diagnostics_group: Diagnóstico
diagnostics_group_descr: Registra eventos técnicos de llegada, búsqueda y construcción en ucp3.log. Déjalo
  desactivado para jugar normalmente.
diagnostics_enabled: Registrar diagnóstico de túneles
diagnostics_enabled_tooltip: 'Predeterminado: desactivado. Registra eventos y como máximo un intento de
  construcción cercano por segundo.'
module_name: Zapadores mejorados
